services:
  postgres:
    image: postgres:16-alpine
    container_name: bunited-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bunited}
      POSTGRES_USER: ${POSTGRES_USER:-bunited}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunited} -d ${POSTGRES_DB:-bunited}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: bunited-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bunited};Username=${POSTGRES_USER:-bunited};Password=${POSTGRES_PASSWORD:-change-me}"
      Jwt__Issuer: ${Jwt__Issuer:-bunited}
      Jwt__Audience: ${Jwt__Audience:-bunited-clients}
      Jwt__SigningKey: ${Jwt__SigningKey:-local-dev-only-jwt-signing-key-not-for-production-use}
      Jwt__AccessTokenLifetimeMinutes: ${Jwt__AccessTokenLifetimeMinutes:-15}
      Jwt__RefreshTokenLifetimeDays: ${Jwt__RefreshTokenLifetimeDays:-30}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
