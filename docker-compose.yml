version: "3.9"

# Scaffolding only. Application service(s) will be added in Phase 1
# once the Api host project exists (see docs/PROMPT.md, section 69).

services:
  postgres:
    image: postgres:16-alpine
    container_name: bunited-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bunited}
      POSTGRES_USER: ${POSTGRES_USER:-bunited}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
