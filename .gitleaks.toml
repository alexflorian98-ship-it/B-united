title = "B-United gitleaks config"

# Extends gitleaks' maintained default ruleset (do not weaken detection); only adds a narrow
# allowlist for specific, documented, non-secret literal strings that are known to trip
# high-entropy/generic-api-key style rules. Nothing here exempts a file or directory wholesale —
# every regex below matches one exact, already-reviewed placeholder value, so a real secret
# pasted anywhere (including inside a Tests/ directory) is still caught.
[extend]
useDefault = true

[allowlist]
description = """
Documented non-secret literal strings that trip generic high-entropy/api-key rules:
(1) in-memory test-host JWT HS256 signing keys that never sign a real token outside an xunit
    TestServer created and torn down within a single test run (see e.g.
    src/Modules/Identity/Tests/Security/JwtTamperingTests.cs,
    src/Modules/Billing/Tests/TestSupport/BillingApiTestHost.cs) — they exist only to satisfy
    JwtOptions' minimum-length validation (JwtAuthenticationExtensions.cs, 32-byte HS256 floor);
(2) the documented placeholder Jwt:SigningKey value that JwtAuthenticationExtensions.cs
    explicitly refuses to start Production with (DocumentedPlaceholderSigningKey);
(3) local-only demo credentials seeded by src/Migrations/Seed/DemoAccountSeeder.cs and the
    Development-only FakeWebhookController signature secret (ADR-010's FakePaymentProvider
    never talks to a real payment provider) — both already named to make their non-production
    nature explicit;
(4) a literal test-fixture password from an earlier commit's LoginHandlerTests.cs (since edited),
    confirmed via a local `gitleaks detect` run against full history to be the one remaining
    finding after the above three were allowlisted — never a real account's password.
"""
regexes = [
  '''this-is-a-test-signing-key-that-is-long-enough-1234567890''',
  '''a-completely-different-signing-key-thats-also-long-enough-000''',
  '''change-me-to-a-random-base64-value-at-least-32-bytes-long''',
  '''DemoAccount123!''',
  '''dev-only-demo-webhook-secret-not-for-production''',
  '''StrongPass123''',
]
